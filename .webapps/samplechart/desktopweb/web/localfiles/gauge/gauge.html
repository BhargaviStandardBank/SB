<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />

    <!-- Highcharts CDN -->
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <script src="https://code.highcharts.com/highcharts-more.js"></script>

    <style>
      body {
        margin: 0;
        background: transparent;
      }
      #container {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>

  <body>
    <div id="container"></div>

    <script>
      var chart;

      function loadGauge(value) {
        chart = Highcharts.chart("container", {
          chart: {
            type: "gauge",
          },

          title: {
            text: "",
          },

          pane: {
            startAngle: -90,
            endAngle: 90,
            background: null,
          },

          yAxis: {
            min: 0,
            max: 30,

            plotBands: [
              { from: 0, to: 12, color: "#1f6b34" }, // Low
              { from: 12, to: 19, color: "#e0b400" }, // Medium
              { from: 19, to: 22, color: "#e67e22" }, // High
              { from: 22, to: 25, color: "#d32f2f" }, // Very High
              { from: 25, to: 30, color: "#8e8e8e" }, // Substandard
            ],
          },

          series: [
            {
              name: "Risk",
              data: [value],
              tooltip: {
                valueSuffix: "",
              },
            },
          ],
        });
      }

      // Called from VoltMX
      function updateGauge(value) {
        if (chart) {
          chart.series[0].points[0].update(value);
        } else {
          loadGauge(value);
        }
      }
    </script>
  </body>
</html>
